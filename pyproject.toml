[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel2ppt-studio"
version = "0.7.1"
description = "把 Excel 台账按单页 PPT 模板逐行生成多页幻灯片：克隆母版页、只换内容，排版/颜色/字体/位置零漂移。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "一片风干叶", email = "104623890@qq.com" }]
keywords = ["excel", "powerpoint", "pptx", "template", "report", "automation", "ooxml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "lxml>=4.9",
  "Pillow>=10",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
preview = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
e2p = "excel2ppt_studio.cli:main"

[project.urls]
Homepage = "https://github.com/grh-cb/excel2ppt-studio"
Issues = "https://github.com/grh-cb/excel2ppt-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel2ppt_studio = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["excel2ppt_studio"]
